# Multi-OS CI: build the Electron GUI (FigmaSiteReplica) for Windows, macOS
# Apple Silicon and macOS Intel on every push to main and on version tags.
#
# Both macOS artifacts come off the same arm64 runner: the app has NO runtime
# dependencies and no native modules, so electron-builder just downloads
# Electron's prebuilt x64 binary and packages it (`--mac --x64`). Building natively
# on an Intel runner would need a `macos-*-intel`/`-large` runner, which is a
# separate (billed) runner class — the free macOS runner is arm64 only.
#
# Trigger from a tag:        git tag v1.0.0 && git push origin v1.0.0
# The tag job also publishes a GitHub Release with all built artifacts.
#
# NOTE: artifacts are UNSIGNED. See signing caveats in replicate/CLAUDE.md or
# the README — Windows shows a SmartScreen warning, macOS needs right-click →
# Open (or `xattr -cr`) on first launch.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --win
          - os: macos-latest
            name: macos-arm64
            args: --mac --arm64
          - os: macos-latest
            name: macos-x64
            args: --mac --x64
    env:
      # No signing certificate on CI runners — tell electron-builder to skip
      # codesign instead of probing for an identity and failing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Bundle worker (worker.cjs)
        working-directory: electron
        run: npm run build:worker

      - name: Package ${{ matrix.name }}
        working-directory: electron
        run: npx electron-builder ${{ matrix.args }}

      # Guard the cross-compiled Intel build: it is produced on an arm64 host, so
      # a silent fallback to the host arch would ship the wrong binary.
      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        working-directory: electron
        shell: bash
        run: |
          APP=$(find dist -maxdepth 3 -name "FigmaSiteReplica.app" | head -1)
          BIN="$APP/Contents/MacOS/FigmaSiteReplica"
          echo "app: $APP"
          file "$BIN"
          ARCH=$(lipo -archs "$BIN")
          echo "arch: $ARCH"
          EXPECTED=${{ contains(matrix.name, 'arm64') && 'arm64' || 'x86_64' }}
          if [ "$ARCH" != "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED but the app is $ARCH"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: FigmaSiteReplica-${{ matrix.name }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.zip
          if-no-files-found: warn
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
