<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Figma Sites 复制工具</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-wrap">
      <h1>Figma Sites 静态复制工具</h1>
      <p>抓取已发布的 *.figma.site 站点并生成静态 HTML/CSS,再与 AI 对话调整页面(如放置交互词云)。</p>
    </div>
    <button id="btn-settings" class="gear" title="AI 设置" aria-label="打开 AI 设置">⚙</button>
  </header>

  <main class="layout">
    <section class="col left">
      <div class="field">
        <label for="url">站点网址</label>
        <input id="url" type="text" spellcheck="false" placeholder="https://example.figma.site/">
      </div>
      <div class="field">
        <label for="out">输出目录</label>
        <div class="out-row">
          <input id="out" type="text" spellcheck="false">
          <button id="btn-pick">选择...</button>
        </div>
        <div class="recent-row">
          <label for="recent">最近:</label>
          <select id="recent">
            <option value="">— 选择最近使用过的目录 —</option>
          </select>
          <span id="dir-status" class="dir-status"></span>
        </div>
      </div>
      <div class="actions">
        <button id="btn-scrape" class="primary">1. 抓取站点</button>
        <button id="btn-build">2. 生成站点</button>
        <button id="btn-open">打开页面</button>
        <span id="status" class="status">就绪</span>
      </div>
      <div class="actions">
        <button id="btn-publish" class="primary">发布到服务器</button>
        <button id="btn-publish-cancel" disabled>取消</button>
        <button id="btn-publish-settings" class="gear" title="发布设置" aria-label="打开发布设置">⚙</button>
        <span id="publish-status" class="status"></span>
      </div>
      <div id="log" aria-live="polite"></div>
    </section>

    <section class="col chat">
      <div class="chat-head">
        <h2>AI 对话</h2>
        <button id="btn-cancel" disabled>取消</button>
      </div>
      <div id="chat" aria-live="polite"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" spellcheck="false" placeholder="例如:在首页顶部放一个关于「旅行」主题的词云">
        <button id="btn-send" class="primary">发送</button>
      </div>
    </section>
  </main>

  <div id="settings" class="modal" hidden>
    <div class="modal-card">
      <h2>AI 设置</h2>
      <div class="field">
        <label for="cfg-key">API Key</label>
        <input id="cfg-key" type="password" spellcheck="false" placeholder="sk-...">
      </div>
      <div class="field">
        <label for="cfg-base">API 地址</label>
        <input id="cfg-base" type="text" spellcheck="false">
      </div>
      <div class="field">
        <label for="cfg-model">模型</label>
        <input id="cfg-model" type="text" spellcheck="false">
      </div>
      <label class="check"><input id="cfg-auto" type="checkbox"> 自动应用修改(跳过确认)</label>
      <div class="modal-actions">
        <button id="btn-cfg-save" class="primary">保存</button>
        <button id="btn-cfg-cancel">关闭</button>
      </div>
      <p id="cfg-msg" class="cfg-msg"></p>
    </div>
  </div>

  <div id="publish-settings" class="modal" hidden>
    <div class="modal-card">
      <h2>发布设置(1Panel)</h2>
      <div class="field">
        <label for="pub-key">API Key</label>
        <input id="pub-key" type="password" spellcheck="false" placeholder="1Panel 个人中心 → API">
      </div>
      <div class="field">
        <label for="pub-base">服务器地址</label>
        <input id="pub-base" type="text" spellcheck="false" placeholder="http://192.168.1.10:8080">
      </div>
      <div class="field">
        <label for="pub-domain">域名</label>
        <input id="pub-domain" type="text" spellcheck="false" placeholder="example.com">
      </div>
      <div class="field">
        <label for="pub-alias">别名(可选,默认同域名)</label>
        <input id="pub-alias" type="text" spellcheck="false">
      </div>
      <div class="field">
        <label for="pub-group">分组 ID(默认 1)</label>
        <input id="pub-group" type="number" spellcheck="false" value="1">
      </div>

      <div class="field">
        <label class="check">
          <input id="pub-https-enabled" type="checkbox">
          发布后申请并启用 HTTPS
        </label>
      </div>
      <div id="pub-https-body" hidden>
        <div class="field">
          <label for="pub-https-method">验证方式</label>
          <select id="pub-https-method">
            <option value="dnsAccount">自动 DNS 验证(推荐,无需开放端口)</option>
            <option value="http">HTTP 验证(需 80 端口外网可达)</option>
            <option value="dnsManual">手动 DNS 验证(需自行添加 TXT 记录)</option>
          </select>
        </div>
        <div class="field" id="pub-https-dns-field">
          <label for="pub-https-dns">DNS 账号(1Panel 中已配置)</label>
          <select id="pub-https-dns"><option value="0">— 请选择 —</option></select>
        </div>
        <div class="field">
          <label for="pub-https-acme">ACME 账号(1Panel 中已配置)</label>
          <select id="pub-https-acme"><option value="0">— 请选择 —</option></select>
        </div>
        <div class="field">
          <label for="pub-https-ssl">已有证书(有则直接绑定,不重复申请)</label>
          <select id="pub-https-ssl"><option value="0">— 无,申请新证书 —</option></select>
        </div>
        <div class="field">
          <label for="pub-https-redirect">HTTP 跳转</label>
          <select id="pub-https-redirect">
            <option value="HTTPToHTTPS">HTTP → HTTPS 跳转</option>
            <option value="HTTPSOnly">仅 HTTPS</option>
            <option value="HTTPAlso">HTTP 与 HTTPS 均可</option>
          </select>
        </div>
        <div class="field">
          <label class="check">
            <input id="pub-https-hsts" type="checkbox">
            启用 HSTS
          </label>
        </div>
        <p class="hint">账号与证书均从 1Panel 读取,凭据由面板保管,本软件不保存。</p>
      </div>

      <div class="modal-actions">
        <button id="btn-pub-https-load">读取 1Panel 账号/证书</button>
        <button id="btn-pub-test">测试连接</button>
        <button id="btn-pub-save" class="primary">保存</button>
        <button id="btn-pub-cancel">关闭</button>
      </div>
      <p id="pub-msg" class="cfg-msg"></p>
    </div>
  </div>

  <div id="confirm" class="modal" hidden>
    <div class="modal-card">
      <h2 id="confirm-title">确认修改</h2>
      <div id="confirm-body" class="confirm-body"></div>
      <div class="modal-actions">
        <button id="btn-confirm-yes" class="primary">应用</button>
        <button id="btn-confirm-no">拒绝</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
